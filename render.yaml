# Render Blueprint: one free web service hosts the built frontend, the API, WebSocket and audio under one https URL.
# Dashboard -> New -> Blueprint -> pick this repo. It asks for the three keys and the debug password on first apply.
services:
  - type: web
    name: trusttag
    runtime: node
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: commit
    # NODE_ENV is unset at build time, so npm ci installs devDependencies (tsc, vite, tsx) that the build and start need.
    buildCommand: cd frontend && npm ci && npm run build && cd ../server && npm ci
    startCommand: cd server && npm start
    healthCheckPath: /api/products
    envVars:
      - key: NODE_VERSION
        value: 22.23.3
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MINIMAX_API_KEY
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: DEBUG_TOKEN
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5-5
      - key: MINIMAX_VOICE_ID
        value: Arrogant_Miss
      - key: MINIMAX_LANGUAGE_BOOST
        value: English
